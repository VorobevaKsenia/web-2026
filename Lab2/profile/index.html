<!DOCTYPE html>
<html>
    <head>
        <title>SM|Profile</title>
        <meta charset="UTF-8"> 
        <link href="profile.css" rel="stylesheet"> 
    </head>
    <body>
        <div class="menu">
            <img src="/img/Menu-home.png" alt="Menu-home">
            <img src="/img/Menu-people.png" alt="Menu-people">
            <img src="/img/Menu-add.png" alt="Menu-add">
        </div>

        <div class="profile">

            <div class="header">

                <div class="about-me">
                    <img class="avatar" src="/img/profile.img/avatar-Vania.png" alt="Avatar-Vania">
                    <p class="name">Ваня Денисов</p>
                    <p class="note">Привет! Я системный аналитик в ACME :) Тут моя жизнь только для самых классных</p>
                </div>

                <div class="iconka">
                    <img class="icon" src="/img/profile.img/Icon-image.png">
                    <p class="count-posts">43 поста</p>
                </div>

            </div>

            <div class="images-posts">
                <img class="image" src="/img/profile.img/snow-street.png" alt="snow-street">
                <img class="image" src="/img/profile.img/Architecture.png" alt="architecture">
                <img class="image" src="/img/profile.img/cake.png" alt="cake">
                <img class="image" src="/img/profile.img/friends.png" alt="friends">
                <img class="image" src="/img/profile.img/rocets.png" alt="rocets">
                <img class="image" src="/img/profile.img/book.png" alt="book">
                <img class="image" src="/img/profile.img/nature.png" alt="nature">
                <img class="image" src="/img/profile.img/Maxim-and-Bogdan.png" alt="Maxim-and-Bogdan">
                <img class="image" src="/img/profile.img/Saucepan.png" alt="Saucepan">
            </div>
            
        </div>
    </body>
</html>
